version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: photography-postgres-dev
    environment:
      POSTGRES_DB: photography
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - photography-dev-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: photography-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - photography-dev-network

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  photography-dev-network:
    driver: bridge